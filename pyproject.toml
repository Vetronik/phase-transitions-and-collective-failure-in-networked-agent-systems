[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collective-agents-phase-transitions"
version = "0.1.0"
description = "Reproducible simulations of communication, collective intelligence, and collective failure"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "networkx>=3.2",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.scripts]
collective-agents = "collective_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
